    <!-- SPA deep-link restore: reads the path encoded by 404.html and replaces history state -->
    <script>
      (function () {
        var redirect = sessionStorage.getItem('spa-redirect');
        if (redirect) {
          sessionStorage.removeItem('spa-redirect');
          var url = new URL(redirect, window.location.href);
          window.history.replaceState(null, '', url.pathname + url.search + url.hash);
        }
      })();
    </script>
